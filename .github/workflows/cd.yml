name: Continuous Delivery (CD)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build Container & Deploy to K8s
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/inference.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/inference-service:latest

      - name: Apply Kubernetes Manifests
        run: |
          echo "Simulating kubectl deployment..."
          # kubectl apply -f k8s/namespace.yaml
          # kubectl apply -f k8s/deployments/
          # kubectl apply -f k8s/services/
          # kubectl rollout status deployment/inference-service -n mlops-anomaly --timeout=120s
