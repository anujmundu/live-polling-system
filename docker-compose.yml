version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Streaming Infrastructure
  # ----------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: itads-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: itads-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # ----------------------------------------------------------------------------
  # Databases & Storage
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: itads-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mlops_anomaly_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: coollabsio/minio:latest
    container_name: itads-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ----------------------------------------------------------------------------
  # MLOps Control Plane
  # ----------------------------------------------------------------------------
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    container_name: itads-mlflow
    depends_on:
      - postgres
      - minio
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://postgres:postgrespassword@postgres:5432/mlops_anomaly_db
      MLFLOW_ARTIFACTS_DESTINATION: s3://telemetry-lakehouse/mlflow-artifacts
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadminpassword
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command: >
      mlflow server
      --backend-store-uri postgresql://postgres:postgrespassword@postgres:5432/mlops_anomaly_db
      --default-artifact-root s3://telemetry-lakehouse/mlflow-artifacts
      --host 0.0.0.0
      --port 5000

  # ----------------------------------------------------------------------------
  # Real-Time Inference Microservice
  # ----------------------------------------------------------------------------
  inference-service:
    build:
      context: .
      dockerfile: docker/inference.Dockerfile
    container_name: itads-inference
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_WORKERS: 2
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - kafka
      - postgres

  # ----------------------------------------------------------------------------
  # Observability & Monitoring
  # ----------------------------------------------------------------------------
  prometheus:
    build:
      context: .
      dockerfile: docker/prometheus.Dockerfile
    container_name: itads-prometheus
    ports:
      - "9090:9090"

  grafana:
    build:
      context: .
      dockerfile: docker/grafana.Dockerfile
    container_name: itads-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/anomaly_detection_dashboard.json
    depends_on:
      - prometheus

volumes:
  postgres_data:
  minio_data:
